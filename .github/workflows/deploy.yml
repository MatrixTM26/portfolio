name: Deploy to GitHub Pages

on:
    push:
        branches:
            - main
    # Allows manual trigger from the Actions tab
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Only one deployment at a time; cancel in-progress if new push comes in
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    # 1. Build
    build:
        name: Build (Vite)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            # Inject the repo name as the Vite base path so assets load correctly
            # on https://<username>.github.io/<repo-name>/
            # If you use a custom domain (CNAME), change BASE_PATH to '/'
            - name: Build with Vite
              env:
                  BASE_PATH: /${{ github.event.repository.name }}/
              run: npm run build -- --base "$BASE_PATH"

            - name: Setup GitHub Pages
              uses: actions/configure-pages@v5

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    # 2. Deploy
    deploy:
        name: Deploy to GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
